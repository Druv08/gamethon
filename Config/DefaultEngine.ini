; Protect the King - 2D
; Engine configuration.
;
; Pixel-art rules of the project live here. Do not override these per-asset;
; if a value needs to change, change it here so all 11 characters stay
; consistent. See Docs/SPRITE_SPEC.md.

[/Script/EngineSettings.GameMapsSettings]
EditorStartupMap=/Game/PTK/Maps/L_PTK_TestGround.L_PTK_TestGround
GameDefaultMap=/Game/PTK/Maps/L_PTK_TestGround.L_PTK_TestGround
GlobalDefaultGameMode=/Script/ProtectTheKing2D.PTKGameModeBase

[/Script/Engine.PhysicsSettings]
; Protect the King is a top-down 2D game played on the world XZ plane.
; World +Z is "up the screen", not "up against gravity", so there is no
; gravity anywhere in this project. Characters additionally set
; GravityScale = 0 and move in MOVE_Flying.
DefaultGravityZ=0.000000

[/Script/Engine.RendererSettings]
; --- Pixel-art image fidelity ------------------------------------------
; Temporal AA and TSR blend neighbouring pixels across frames, which turns
; crisp pixel art into a smeared mess while the camera moves. 0 = none.
r.AntiAliasingMethod=0
r.DefaultFeature.AntiAliasing=0
r.DefaultFeature.MotionBlur=False
r.DefaultFeature.Bloom=False
r.DefaultFeature.AmbientOcclusion=False
r.DefaultFeature.AmbientOcclusionStaticFraction=False
; Exposure is pinned to 1.0 on the character camera (see PTKTopDownCharacter.cpp).
; Paper2D sprites are UNLIT and output 0..1, whereas Unreal's exposure pipeline
; expects physically-based luminance - roughly 500x larger. Leaving exposure
; free tonemaps unlit sprites to pure black while UI still renders, which looks
; exactly like a sprite that failed to draw.
r.DefaultFeature.AutoExposure=False
r.DefaultFeature.AutoExposure.Method=0
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=False
r.EyeAdaptation.MethodOverride=2
r.DefaultFeature.LensFlare=False

; Render at exactly 100% so on-screen pixels map 1:1 to rendered pixels.
r.ScreenPercentage=100.000000

; Sprites are unlit; static lighting only produces useless lightmap warnings.
r.AllowStaticLighting=False

; Sprites carry their own alpha; keep the default masked sprite material sharp.
r.MipMapLODBias=0

[/Script/Engine.Engine]
; Fixed, predictable framerate smoothing for animation timing sanity.
bSmoothFrameRate=True

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12

[/Script/HardwareTargeting.HardwareTargetingSettings]
TargetedHardwareClass=Desktop
AppliedTargetedHardwareClass=Desktop
DefaultGraphicsPerformance=Maximum
AppliedDefaultGraphicsPerformance=Maximum

