; Protect the King - 2D
; Editor configuration.

[/Script/Paper2DEditor.PaperImporterSettings]
; ----------------------------------------------------------------------
; THE PIXELS-PER-UNREAL-UNIT CONVENTION FOR THIS PROJECT
;
;   1 source pixel = 1 Unreal unit.
;
; A 128x128 frame is therefore 128 uu tall, the orthographic camera width
; is a direct pixel count, and movement speeds are readable as pixels per
; second. Every character, tile and prop obeys this - never rescale an
; individual sprite to compensate for anything.
;
; UE 5.8 already ships these values as defaults; they are pinned here so a
; future engine default cannot silently change the look of the game.
; ----------------------------------------------------------------------
DefaultPixelsPerUnrealUnit=1.000000

; Pixels2D texture group = nearest-neighbour filtering, no mip bias.
DefaultSpriteTextureGroup=TEXTUREGROUP_Pixels2D

; Uncompressed RGBA. DXT compression produces colour bleeding and dirty
; alpha edges that are extremely visible at pixel-art scale.
bOverrideTextureCompression=True
DefaultSpriteTextureCompression=TC_EditorIcon

; Pick masked vs translucent automatically from the alpha channel. Hard
; alpha pixel art resolves to the masked material, which writes depth and
; therefore sorts correctly against other sprites.
bPickBestMaterialWhenCreatingSprites=True
bPickBestMaterialWhenCreatingTileMaps=True
bAnalysisCanUseOpaque=False

[/Script/UnrealEd.EditorLoadingSavingSettings]
bMonitorContentDirectories=True
